<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Muvik</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:10px;font-family:Arial;background:#f2f7ff;color:#17243b}button{font:inherit;border:0;cursor:pointer}.top{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:linear-gradient(135deg,#dcecff,#e9ddff);border:2px solid #b5d1ff;border-radius:16px;margin-bottom:12px}.lang{padding:10px;border-radius:10px;background:white;font-weight:bold}.active{outline:3px solid #3986ef}.edit{margin-left:auto;background:#225fcb;color:white;padding:10px 14px;border-radius:10px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border:3px solid var(--edge);border-radius:16px;background:var(--tile);overflow:hidden;min-width:0;display:flex;flex-direction:column;padding:0;color:#111}.pic{height:clamp(125px,37vw,230px);display:grid;place-items:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:contain}.emoji{font-size:clamp(65px,18vw,110px)}.names{background:#ffffffdc;text-align:center;padding:8px 3px;min-height:66px}.pl{font-size:15px;font-weight:bold}.uk{font-size:clamp(20px,5vw,28px);font-weight:900;margin-top:3px}.back{background:#2568d8;color:white;padding:10px 14px;border-radius:10px;margin:0 0 12px}.panel{display:none;background:white;border-radius:16px;padding:12px}.editing .panel{display:block}.editing #content{display:none}.buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.action{min-height:52px;padding:10px 5px;border-radius:12px;background:#eaf2ff;color:#183b75;font-weight:bold}.danger{background:#ffeded;color:#a52d2d}.wide{grid-column:1/-1;background:#dff5e8}.group{margin-top:12px;padding:10px;background:#f4f7fc;border-radius:12px}.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.swatch{height:38px;border:2px solid #ddd;border-radius:8px}.hint{font-size:12px;color:#68758b}.hidden{display:none!important}.toast{position:fixed;bottom:15px;left:10%;width:80%;background:#18243a;color:white;padding:10px;border-radius:10px;text-align:center;display:none}#up{position:fixed;right:14px;bottom:15px;border-radius:50%;width:46px;height:46px;background:#2568d8;color:white;font-size:24px;display:none}
</style></head><body><div class="top" id="top"></div><main id="content"></main>
<section class="panel" id="panel"><h2>Редагування Muvik</h2><div class="buttons">
<button class="action" onclick="addCat()">➕ Додати колонку</button><button class="action danger" onclick="delCat()">🗑 Видалити колонку</button>
<button class="action" onclick="addItem()">🖼 Додати картинку</button><button class="action danger" onclick="delItem()">🗑 Видалити картинку</button>
<button class="action" onclick="editItem()">✏️ Редагувати картинку</button><button class="action" onclick="editCat()">✏️ Назва розділу</button>
<button class="action" onclick="addLang()">🌐 Додати мову</button><button class="action danger" onclick="delLang()">🌐 Видалити мову</button>
<button class="action" onclick="showColors()">🎨 Додати фон</button><button class="action" onclick="resetBg()">↩️ Стандартний</button>
<button class="action" onclick="pickBg()">📷 Фон з галереї</button><button class="action" onclick="pickCatPhoto()">🖼 Фото колонки</button>
<button class="action" onclick="preview()">👁 Перегляд</button><button class="action wide" onclick="closeEdit()">💾 Зберегти та вийти</button></div>
<div class="group"><b>Кольори фону</b><div id="swatches" class="swatches"></div></div>
<div class="group"><b>Озвучення</b><p><select id="voice" onchange="data.voice=this.value;save()"><option value="normal">Звичайний</option><option value="female">Жіночий</option><option value="male">Чоловічий</option><option value="child">Дитячий</option><option value="cartoon">Мультяшний</option></select></p><p>Швидкість <input id="rate" type="range" min="60" max="140" value="100" oninput="data.rate=+this.value;save()"></p><button class="action" onclick="testVoice()">🔊 Прослухати голос</button><p class="hint">Голос залежить від системного TTS Android; стилі змінюють висоту тону.</p></div>
</section><input id="file" type="file" accept="image/*" class="hidden"><div class="toast" id="toast"></div><button id="up" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button>
<script>
const langs={uk:['Українська','🇺🇦'],pl:['Polski','🇵🇱'],en:['English','🇬🇧'],de:['Deutsch','🇩🇪'],fr:['Français','🇫🇷'],es:['Español','🇪🇸'],it:['Italiano','🇮🇹'],cs:['Čeština','🇨🇿'],sk:['Slovenčina','🇸🇰']};
const colors=['#fff0d8','#fff6b9','#f8dff0','#e0f6d5','#dff2ff','#e9e0ff','#ffe0df','#dcf7ef','#f4e9d9','#e8edff','#fce4ed','#e5f5ff'],edges=['#e85b43','#e3a900','#c22e86','#278a45','#2583bb','#774ac5'];
const names=[['Овочі','Warzywa','🥕',[['Морква','Marchew','🥕'],['Картопля','Ziemniaki','🥔']]],['Фрукти','Owoce','🍎',[['Яблуко','Jabłko','🍎'],['Груша','Gruszka','🍐']]],['Тварини','Zwierzęta','🐶',[['Собака','Pies','🐶'],['Кіт','Kot','🐱']]],['Дикі тварини','Dzikie zwierzęta','🦊',[['Лисиця','Lis','🦊'],['Ведмідь','Niedźwiedź','🐻']]],['Кольори','Kolory','🌈',[['Червоний','Czerwony','🔴'],['Синій','Niebieski','🔵']]],['Повсякденне життя','Życie codzienne','🏠',[['Пити','Pić','🥤'],['Спати','Spać','🛏️']]]];
function initial(){return {langs:['uk','pl'],active:'uk',page:'home',editing:false,voice:'normal',rate:100,bg:'#f2f7ff',photo:'',cats:names.map((n,i)=>({id:'c'+i,n:{uk:n[0],pl:n[1]},emoji:n[2],items:n[3].map((v,j)=>({id:'i'+i+j,n:{uk:v[0],pl:v[1]},emoji:v[2],tile:colors[(i*2+j)%12],edge:edges[(i*2+j)%6]})),bg:'',photo:''}))}}
const KEY='muvik_v4';let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial()}catch(e){data=initial()}if(!Array.isArray(data.cats)||!data.cats.length)data=initial();data.editing=false;data.page='home';
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('Недостатньо пам’яті для фото')}}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2400)}
function cur(){return data.cats.find(c=>c.id===data.page)}
function label(o){return o.n[data.active]||o.n.uk||o.n.pl||''}
function askNames(old={}){let n={...old};for(let l of data.langs){let v=prompt('Назва '+langs[l][1]+' '+langs[l][0],n[l]||'');if(v===null)return null;n[l]=v.trim()}return n}
function render(){document.body.classList.toggle('editing',data.editing);let top=document.getElementById('top');top.replaceChildren();data.langs.forEach(l=>{let b=document.createElement('button');b.className='lang'+(l===data.active?' active':'');b.textContent=langs[l][1]+' '+langs[l][0];b.onclick=()=>{data.active=l;save();render()};top.append(b)});let eb=document.createElement('button');eb.className='edit';eb.textContent='✎ Редагувати';eb.onclick=toggleEdit;top.append(eb);let c=cur();setBg(c);let main=document.getElementById('content');main.replaceChildren();let grid=document.createElement('div');grid.className='grid';if(!c){data.cats.forEach(x=>grid.append(card(x,true)));main.append(grid)}else{let back=document.createElement('button');back.className='back';back.textContent='← До розділів';back.onclick=()=>{data.page='home';save();render()};main.append(back);let h=document.createElement('h2');h.textContent=label(c);main.append(h);c.items.forEach(x=>grid.append(card(x,false)));main.append(grid)}document.getElementById('voice').value=data.voice;document.getElementById('rate').value=data.rate;drawColors()}
function setBg(c){let p=c?c.photo:data.photo,k=c?(c.bg||data.bg):data.bg;if(p&&p.startsWith('db:'))getPhoto(p).then(url=>{document.body.style.background=url?'center/cover fixed url('+url+')':k});else document.body.style.background=p?'center/cover fixed url('+p+')':k}
function card(o,isCat){let b=document.createElement('button');b.className='card';b.style.setProperty('--edge',o.edge||'#2583bb');b.style.setProperty('--tile',o.tile||'#fff0d8');let p=document.createElement('div');p.className='pic';if(o.photo){let im=document.createElement('img');im.src=o.photo.startsWith('db:')?'':o.photo;if(o.photo.startsWith('db:'))getPhoto(o.photo).then(u=>{if(u&&im.isConnected)im.src=u});p.append(im)}else{let em=document.createElement('span');em.className='emoji';em.textContent=o.emoji||'🖼️';p.append(em)}b.append(p);let n=document.createElement('div');n.className='names';let pl=document.createElement('div');pl.className='pl';pl.textContent=o.n.pl||'';let uk=document.createElement('div');uk.className='uk';uk.textContent=o.n.uk||label(o);n.append(pl,uk);b.append(n);b.onclick=()=>{if(isCat){data.page=o.id;save();render()}else if(window.AndroidTTS)AndroidTTS.speak(label(o),data.active,data.voice,String(data.rate/100))};return b}
function toggleEdit(){if(!data.editing&&prompt('Введи код редагування:')!=='1234')return toast('Неправильний код');data.editing=!data.editing;save();render()}
function closeEdit(){data.editing=false;save();render();toast('Зміни збережено')}function preview(){closeEdit()}
function addCat(){let n=askNames({});if(!n||!Object.values(n).some(Boolean))return;data.cats.push({id:'c'+Date.now(),n,emoji:'📁',items:[],bg:'',photo:''});save();render()}
function delCat(){let v=prompt(data.cats.map((c,i)=>(i+1)+'. '+label(c)).join('\n'));if(v===null)return;let i=+v-1;if(!data.cats[i])return toast('Неправильний номер');if(confirm('Видалити розділ і всі картинки?')){data.cats.splice(i,1);data.page='home';save();render()}}
function editCat(){let c=cur();if(!c)return toast('Відкрий розділ');let n=askNames(c.n);if(n){c.n=n;save();render()}}
let fileDone=null;function pickFile(cb){fileDone=cb;let f=document.getElementById('file');f.value='';f.click()}
function db(){return new Promise((ok,no)=>{let r=indexedDB.open('MuvikPhotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function putPhoto(file){let blob=await new Promise((ok,no)=>{let r=new FileReader();r.onerror=no;r.onload=()=>{let im=new Image();im.onerror=no;im.onload=()=>{let s=Math.min(1,1000/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cv.toBlob(b=>b?ok(b):no(Error()),'image/jpeg',.78)};im.src=r.result};r.readAsDataURL(file)});let d=await db(),key='p'+Date.now()+Math.random();await new Promise((ok,no)=>{let t=d.transaction('p','readwrite');t.objectStore('p').put(blob,key);t.oncomplete=ok;t.onerror=()=>no(t.error)});d.close();return 'db:'+key}
async function getPhoto(key){let d=await db(),blob=await new Promise((ok,no)=>{let r=d.transaction('p').objectStore('p').get(key.slice(3));r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});d.close();return blob?URL.createObjectURL(blob):''}
document.getElementById('file').onchange=async function(){let f=this.files[0],cb=fileDone;fileDone=null;if(!f||!cb)return;try{cb(await putPhoto(f));save();render()}catch(e){toast('Не вдалося зберегти фото')}};
function addItem(){let c=cur();if(!c)return toast('Спочатку відкрий розділ');let n=askNames({});if(!n||!Object.values(n).some(Boolean))return;pickFile(p=>c.items.push({id:'i'+Date.now(),n,photo:p,emoji:'🖼️',tile:colors[c.items.length%12],edge:edges[c.items.length%6]}))}
function pickIndex(c,what){let n=prompt('Номер картинки для '+what+':\n'+c.items.map((x,i)=>(i+1)+'. '+label(x)).join('\n'));if(n===null)return -1;let i=+n-1;return c.items[i]?i:-1}
function delItem(){let c=cur();if(!c)return toast('Відкрий розділ');let i=pickIndex(c,'видалення');if(i<0)return;if(confirm('Видалити картинку?')){c.items.splice(i,1);save();render()}}
function editItem(){let c=cur();if(!c||!c.items.length)return toast('Немає картинок');let i=pickIndex(c,'редагування');if(i<0)return;let n=askNames(c.items[i].n);if(!n)return;c.items[i].n=n;if(confirm('Замінити фото?'))pickFile(p=>c.items[i].photo=p);else{save();render()}}
function addLang(){let a=Object.keys(langs).filter(x=>!data.langs.includes(x));let v=prompt(a.map((x,i)=>(i+1)+'. '+langs[x][0]).join('\n'));if(v===null)return;let l=a[+v-1];if(!l)return toast('Неправильний номер');data.langs.push(l);save();render()}
function delLang(){if(data.langs.length<2)return toast('Потрібна хоча б одна мова');let v=prompt(data.langs.map((x,i)=>(i+1)+'. '+langs[x][0]).join('\n'));if(v===null)return;let l=data.langs[+v-1];if(!l)return toast('Неправильний номер');if(!confirm('Видалити мову?'))return;data.langs=data.langs.filter(x=>x!==l);if(data.active===l)data.active=data.langs[0];save();render()}
function showColors(){document.getElementById('swatches').scrollIntoView({behavior:'smooth'})}
function drawColors(){let e=document.getElementById('swatches');e.replaceChildren();colors.forEach(c=>{let b=document.createElement('button');b.className='swatch';b.style.background=c;b.onclick=()=>{let x=cur();if(x){x.bg=c;x.photo=''}else{data.bg=c;data.photo=''}save();render()};e.append(b)})}
function resetBg(){let c=cur();if(c){c.bg='';c.photo=''}else{data.bg='#f2f7ff';data.photo=''}save();render()}
function pickBg(){pickFile(p=>{let c=cur();if(c){c.photo=p;c.bg=''}else{data.photo=p;data.bg='#f2f7ff'}save();render()})}
function pickCatPhoto(){let c=cur();if(!c)return toast('Відкрий розділ');pickFile(p=>{c.photo=p;save();render()})}
function testVoice(){if(window.AndroidTTS)AndroidTTS.speak(data.active==='pl'?'Cześć!':'Привіт!',data.active,data.voice,String(data.rate/100))}
window.addEventListener('scroll',()=>document.getElementById('up').style.display=scrollY>160?'block':'none');render();
</script></body></html>
