name: Build Muvik APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip "MuvikAndroidProject (7).zip" -d extracted
          echo "=== MAIN ACTIVITY ==="
          cat extracted/MuvikAndroidProject/app/src/main/java/com/muvik/aac/MainActivity.kt
          echo "=== HTML SOURCE ==="
          cat extracted/MuvikAndroidProject/app/src/main/assets/index.html
          test -f extracted/MuvikAndroidProject/app/build.gradle.kts

      - name: Align Java and Kotlin JVM targets
        run: |
          cat >> extracted/MuvikAndroidProject/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Build APK
        run: |
          cd extracted/MuvikAndroidProject
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Muvik-APK
          path: extracted/MuvikAndroidProject/app/build/outputs/apk/debug/*.apk
